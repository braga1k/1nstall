name: Windows checks and release build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  headless:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Catalog and metadata
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path test-logs -Force | Out-Null
          python tests/catalog.py | Tee-Object test-logs/catalog.txt
          if ($LASTEXITCODE -ne 0) { throw 'Catalog check failed.' }
      - name: Headless reliability regressions
        shell: powershell
        run: .\tests\reliability.ps1 | Tee-Object test-logs/reliability.txt
      - name: Portable executable and build metadata
        shell: powershell
        run: .\build-windows.ps1
      - name: Packaged self-test (no interactive desktop)
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\1nstall.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Packaged self-test failed.' }
          Get-Content .\dist\self-test.log
      - name: Verified portable and source archives
        shell: powershell
        run: .\scripts\package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: 1nstall-windows
          path: |
            dist/release/*
  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/3.2.0'
    needs: headless
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: 1nstall-windows
          path: release-assets
      - name: Verify and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          # Drafts with pending tags are available in the authenticated release list, not by tag.
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > ../releases.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          matches = [r for page in json.loads(Path('../releases.json').read_text()) for r in page
                     if r['tag_name'] == 'v3.2.0']
          assert len(matches) <= 1, 'Multiple draft releases require owner review'
          if matches:
              draft = matches[0]
              assert draft['draft'] and not draft['prerelease'], 'Never replace a published release'
              assert draft['author']['login'] == 'github-actions[bot]'
              assert draft['name'] == '1nstall 3.2.0'
              subprocess.run(['git', 'merge-base', '--is-ancestor', draft['target_commitish'],
                              os.environ['RELEASE_COMMIT']], cwd='..', check=True)
              Path('../resume-draft').write_text(str(draft['id']))
          PY
          if [ -f ../resume-draft ]; then
            gh release edit v3.2.0 --target "$RELEASE_COMMIT" --draft=true \
              --prerelease=false --latest=false --notes-file ../docs/releases/3.2.0.md
            gh release upload v3.2.0 ./* --clobber
          else
            gh release create v3.2.0 ./* \
              --target "$RELEASE_COMMIT" --draft --prerelease=false --latest=false \
              --title '1nstall 3.2.0' \
              --notes-file ../docs/releases/3.2.0.md
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > ../releases.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          matches = [r for page in json.loads(Path('../releases.json').read_text()) for r in page
                     if r['tag_name'] == 'v3.2.0']
          assert len(matches) == 1
          release = matches[0]
          expected = {p.name: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in Path('.').iterdir() if p.is_file()}
          assert release['draft'] and not release['prerelease']
          assert release['target_commitish'] == os.environ['RELEASE_COMMIT']
          actual = {a['name']: a['digest'] for a in release['assets'] if a['state'] == 'uploaded'}
          assert actual == expected, 'Uploaded release assets differ from verified build'
          print('PASS: uploaded asset names, SHA-256 digests and commit verified before publication.')
          PY
          gh release edit v3.2.0 --draft=false --prerelease=false --latest
