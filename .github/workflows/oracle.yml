name: Oracle (recorded 3.6 behaviour)
on:
  push:
    branches:
      - 'oracle/**'
      - 'v4/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    name: Pure functions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the golden file with the 3.6 helpers
        shell: powershell
        run: .\oracle\drivers\v36-pure.ps1 -Out oracle\golden\v3.6.0\pure.jsonl
      - name: Golden file must be byte-identical to the committed one
        shell: bash
        run: |
          file=oracle/golden/v3.6.0/pure.jsonl
          if git diff --exit-code --quiet -- oracle/golden; then
            echo "::notice title=oracle pure (${{ matrix.os }})::$(wc -l < "$file" | tr -d ' ') cases reproduced byte-for-byte; sha256 $(sha256sum "$file" | cut -c1-64)"
          else
            git diff -U0 -- oracle/golden | grep -E '^[+-]\{' | head -8 | while IFS= read -r line; do
              echo "::warning title=oracle pure diff (${{ matrix.os }})::${line:0:600}"
            done
            echo "::error title=oracle pure (${{ matrix.os }})::golden differs on this machine (added/removed lines: $(git diff --numstat -- oracle/golden | cut -f1,2 | tr '\t' '/'))"
            exit 1
          fi
  engine:
    name: Rust engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.86.0
        shell: bash
        run: |
          rustup toolchain install 1.86.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.86.0
          cargo --version
      - name: Format and lint
        shell: bash
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
      - name: Rust rules against the recorded 3.6 behaviour
        shell: bash
        run: |
          cargo test --locked -- --nocapture 2>&1 | tee test.log
          grep -E '^oracle [a-z]+:' test.log | while IFS= read -r line; do
            echo "::notice title=engine (${{ matrix.os }})::$line"
          done
          echo "::notice title=engine (${{ matrix.os }})::$(grep -cE '^hostile files: .* without failing' test.log) readers of damaged files passed; $(grep -E '^test result:' test.log | awk '{ passed += $4; failed += $6 } END { print passed " tests passed, " failed " failed" }')"
      - name: Rust removal scenarios against the recorded 3.6 behaviour
        shell: bash
        env:
          ORACLE_DISPOSABLE: '1'
        run: |
          cargo test --locked -p oneinstall-harness --test oracle_removal -- --nocapture 2>&1 | tee removal.log
          grep -E '^oracle removal:' removal.log | while IFS= read -r line; do
            echo "::notice title=engine (${{ matrix.os }})::$line"
          done
      - name: Remove, scan and clean a fixture app through the engine boundary (disposable machine)
        shell: bash
        env:
          ORACLE_DISPOSABLE: '1'
        run: |
          set +e
          cargo test --locked -p oneinstall-harness --test uninstall_boundary -- --nocapture 2>&1 | tee uninstall.log
          result=${PIPESTATUS[0]}
          grep -E '^oracle uninstall:.*(stages|removed, scanned|stop asked)' uninstall.log | while IFS= read -r line; do
            echo "::notice title=engine (${{ matrix.os }})::${line:0:600}"
          done
          if [ "$result" -ne 0 ]; then
            echo "::error title=engine (${{ matrix.os }})::uninstall boundary test failed: $(grep -E 'panicked|assertion|left:|right:' uninstall.log | head -4 | tr '\n' ' ' | cut -c1-600)"
          fi
          exit "$result"
      - name: Real WinGet install through the Rust queue (disposable machine)
        shell: bash
        timeout-minutes: 20
        continue-on-error: true
        env:
          ORACLE_DISPOSABLE: '1'
        run: |
          set +e
          cargo test --locked -p oneinstall-harness --test real_install -- --nocapture 2>&1 | tee install.log
          result=${PIPESTATUS[0]}
          grep -E '^oracle install:' install.log | while IFS= read -r line; do
            echo "::notice title=engine (${{ matrix.os }})::${line:0:600}"
          done
          if [ "$result" -ne 0 ]; then
            echo "::warning title=engine (${{ matrix.os }})::real install test failed: $(grep -E 'panicked|assertion|left:|right:' install.log | head -4 | tr '\n' ' ' | cut -c1-500)"
          fi
          exit "$result"
  app:
    name: 1nstall 4.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.86.0
        shell: bash
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
      - name: Build the single executable
        shell: powershell
        run: |
          $line = .\app\build.ps1 | Select-Object -Last 1
          Write-Output "::notice title=app (${{ matrix.os }})::built $line"
      - name: Self-test through the engine boundary (no interactive desktop)
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\v4\1nstall.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          Get-Content .\dist\v4\self-test.log
          if ($p.ExitCode -ne 0) { throw 'Self-test failed.' }
          $passed = @(Get-Content .\dist\v4\self-test.log | Where-Object { $_ -like 'PASS *' }).Count
          Write-Output "::notice title=app (${{ matrix.os }})::self-test: $passed checks passed, exit code 0"
      - name: The released 3.6.0 executable updates itself to 4.0 (disposable machine)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path released -Force | Out-Null
          Invoke-WebRequest -Uri https://github.com/braga1k/1nstall/releases/download/v3.6.0/1nstall.exe -OutFile released\1nstall.exe -UseBasicParsing
          $hash = (Get-FileHash released\1nstall.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '90428e1ea21db5f5b939aab920db3309a457fc4bd4ac116641fb1754feb8508c') { throw "Unexpected 3.6.0 download: $hash" }
          .\app\tests\update-bridge.ps1 -Exe .\dist\v4\1nstall.exe -Released36 released\1nstall.exe -DisposableEnvironment | ForEach-Object {
            Write-Output $_
            if ($_ -like 'bridge *') { Write-Output "::notice title=app (${{ matrix.os }})::$_" }
          }
  window:
    name: Window tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      TITLE: (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.86.0
        shell: bash
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
      - name: A screen large enough for the window
        shell: powershell
        continue-on-error: true
        run: |
          $problem = ''
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { $problem = "; changing it failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Output "::notice title=window $env:TITLE::screen $($screen.Width) x $($screen.Height)$($problem -replace '\s+',' ')"
      - name: Build the application and the stand-in programs
        shell: powershell
        run: |
          $line = .\app\build.ps1 | Select-Object -Last 1
          Write-Output "built $line"
          Push-Location engine
          cmd /c "cargo build --locked -p oneinstall-harness --bins 2>&1"
          if ($LASTEXITCODE -ne 0) { throw 'Stand-in programs did not build.' }
          Pop-Location
          $winget = [bool](Get-Command winget -ErrorAction SilentlyContinue)
          Add-Content -Path $env:GITHUB_ENV -Value "HAS_WINGET=$winget"
          Write-Output "::notice title=window $env:TITLE::built $line; WinGet on this image: $winget"
      - name: Library
        shell: powershell
        continue-on-error: true
        run: |
          if ($env:HAS_WINGET -eq 'True') { .\app\tests\report.ps1 -Title "library ui $env:TITLE" -Test { .\app\tests\library-ui.ps1 -Exe .\dist\v4\1nstall.exe } }
          else { .\app\tests\report.ps1 -Title "library ui $env:TITLE" -Test { .\app\tests\library-ui.ps1 -Exe .\dist\v4\1nstall.exe -SkipInventory } }
      - name: Settings
        shell: powershell
        continue-on-error: true
        run: .\app\tests\report.ps1 -Title "settings ui $env:TITLE" -Test { .\app\tests\settings-ui.ps1 -Exe .\dist\v4\1nstall.exe }
      - name: Uninstall page (reads only)
        shell: powershell
        continue-on-error: true
        run: .\app\tests\report.ps1 -Title "uninstall ui $env:TITLE" -Test { .\app\tests\uninstall-ui.ps1 -Exe .\dist\v4\1nstall.exe }
      - name: History and diagnostics
        shell: powershell
        continue-on-error: true
        run: |
          if ($env:HAS_WINGET -eq 'True') { .\app\tests\report.ps1 -Title "history ui $env:TITLE" -Test { .\app\tests\history-ui.ps1 -Exe .\dist\v4\1nstall.exe } }
          else { .\app\tests\report.ps1 -Title "history ui $env:TITLE" -Test { .\app\tests\history-ui.ps1 -Exe .\dist\v4\1nstall.exe -SkipInventory } }
      - name: Install queue with a stand-in for WinGet
        shell: powershell
        continue-on-error: true
        run: .\app\tests\report.ps1 -Title "queue ui $env:TITLE" -Test { .\app\tests\queue-ui.ps1 -Exe .\dist\v4\1nstall.exe -StandIn .\engine\target\debug\oracle-fixture.exe }
      - name: File dialogs and the detailed log
        shell: powershell
        continue-on-error: true
        run: |
          if ($env:HAS_WINGET -eq 'True') { .\app\tests\report.ps1 -Title "dialogs ui $env:TITLE" -Test { .\app\tests\dialogs-ui.ps1 -Exe .\dist\v4\1nstall.exe -OpenLog } }
          else { .\app\tests\report.ps1 -Title "dialogs ui $env:TITLE" -Test { .\app\tests\dialogs-ui.ps1 -Exe .\dist\v4\1nstall.exe -OpenLog -SkipInventory } }
      - name: Window size, names, languages, themes and keyboard
        shell: powershell
        continue-on-error: true
        run: .\app\tests\report.ps1 -Title "window ui $env:TITLE" -Test { .\app\tests\window-ui.ps1 -Exe .\dist\v4\1nstall.exe -Keyboard -Pictures pictures }
      - name: Update from Settings, with a build numbered 3.5.0 (disposable machine)
        shell: powershell
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $source = [IO.File]::ReadAllText("$PWD\app\Program.cs")
          $older = $source.Replace('AssemblyVersion("4.0.0.0")','AssemblyVersion("3.5.0.0")').Replace('AssemblyFileVersion("4.0.0.0")','AssemblyFileVersion("3.5.0.0")').Replace('public const string Version="4.0.0";','public const string Version="3.5.0";')
          if ($older -eq $source -or ($older.Split("`n") | Where-Object { $_ -match '3\.5\.0' }).Count -ne 3) { throw 'The version lines of Program.cs were not found.' }
          [IO.File]::WriteAllText("$PWD\app\Program.cs", $older)
          try { $line = .\app\build.ps1 -Out "$PWD\dist\older" | Select-Object -Last 1 } finally { [IO.File]::WriteAllText("$PWD\app\Program.cs", $source) }
          Write-Output "older build: $line"
          .\app\tests\report.ps1 -Title "update ui $env:TITLE" -Test { .\app\tests\update-ui.ps1 -Exe .\dist\older\1nstall.exe -ExpectedHash 90428e1ea21db5f5b939aab920db3309a457fc4bd4ac116641fb1754feb8508c -DisposableEnvironment }
      - name: Normal mode on a disposable machine - Windows theme, settings, fixture removal, cleanup, stopping
        shell: powershell
        continue-on-error: true
        timeout-minutes: 30
        run: .\app\tests\report.ps1 -Title "disposable ui $env:TITLE" -Test { .\app\tests\disposable-ui.ps1 -Exe .\dist\v4\1nstall.exe -Publisher .\engine\target\debug\oracle-publisher.exe -DisposableEnvironment -Pictures pictures }
      - name: Normal mode on a disposable machine - real apps installed by WinGet and removed by their uninstallers
        if: env.HAS_WINGET == 'True'
        shell: powershell
        continue-on-error: true
        timeout-minutes: 60
        run: .\app\tests\report.ps1 -Title "real apps ui $env:TITLE" -Test { .\app\tests\disposable-ui.ps1 -Exe .\dist\v4\1nstall.exe -Publisher .\engine\target\debug\oracle-publisher.exe -DisposableEnvironment -Real -RealOnly -Pictures pictures }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-pictures-${{ matrix.os }}
          path: |
            pictures/
            dist/v4/test-logs/
          if-no-files-found: warn
      - name: Every window test must have passed
        shell: powershell
        run: |
          $failed = @(Get-ChildItem -Path test-failures -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { $_.BaseName })
          if ($failed.Count) { throw "Failed: $($failed -join ', ')" }
  observe:
    name: Machine observations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Existing native removal tests (disposable machine)
        shell: powershell
        timeout-minutes: 12
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage tests -Out oracle-out
      - name: Remove, scan and clean fixture apps, recording machine state
        shell: powershell
        timeout-minutes: 12
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage removal -Out oracle-out
      - name: Removal recording must match the committed one
        shell: bash
        run: |
          golden=oracle/golden/v3.6.0/removal.jsonl
          if [ ! -f oracle-out/removal.jsonl ]; then
            echo "::error title=oracle removal (${{ matrix.os }})::no recording was produced"; exit 1
          fi
          if ! git ls-files --error-unmatch "$golden" >/dev/null 2>&1; then
            echo "::notice title=oracle removal (${{ matrix.os }})::no committed recording yet; this run only records"; exit 0
          fi
          cp oracle-out/removal.jsonl "$golden"
          if git diff --exit-code --quiet -- "$golden"; then
            echo "::notice title=oracle removal (${{ matrix.os }})::$(wc -l < "$golden" | tr -d ' ') recorded lines reproduced byte-for-byte; sha256 $(sha256sum "$golden" | cut -c1-64)"
          else
            git diff -U0 --word-diff=porcelain --word-diff-regex='[^,{}]+' -- "$golden" | grep -E '^[+-][^+-]' | head -8 | while IFS= read -r line; do
              echo "::warning title=oracle removal diff (${{ matrix.os }})::${line:0:500}"
            done
            echo "::error title=oracle removal (${{ matrix.os }})::recording differs from the committed one"; exit 1
          fi
      - name: How 3.6 reads this machine's uninstall registrations
        shell: powershell
        timeout-minutes: 8
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage inventory -Out oracle-out
      - name: Real WinGet install through the 3.6 install path
        shell: powershell
        timeout-minutes: 25
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage winget -Out oracle-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-observations-${{ matrix.os }}
          path: oracle-out/
          if-no-files-found: warn
