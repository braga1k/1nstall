name: Oracle (recorded 3.6 behaviour)
on:
  push:
    branches:
      - 'oracle/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    name: Pure functions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the golden file with the 3.6 helpers
        shell: powershell
        run: .\oracle\drivers\v36-pure.ps1 -Out oracle\golden\v3.6.0\pure.jsonl
      - name: Golden file must be byte-identical to the committed one
        shell: bash
        run: |
          file=oracle/golden/v3.6.0/pure.jsonl
          if git diff --exit-code --quiet -- oracle/golden; then
            echo "::notice title=oracle pure (${{ matrix.os }})::$(wc -l < "$file" | tr -d ' ') cases reproduced byte-for-byte; sha256 $(sha256sum "$file" | cut -c1-64)"
          else
            git diff -U0 -- oracle/golden | grep -E '^[+-]\{' | head -8 | while IFS= read -r line; do
              echo "::warning title=oracle pure diff (${{ matrix.os }})::${line:0:600}"
            done
            echo "::error title=oracle pure (${{ matrix.os }})::golden differs on this machine (added/removed lines: $(git diff --numstat -- oracle/golden | cut -f1,2 | tr '\t' '/'))"
            exit 1
          fi
  observe:
    name: Machine observations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Existing native removal tests (disposable machine)
        shell: powershell
        timeout-minutes: 12
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage tests -Out oracle-out
      - name: Remove, scan and clean fixture apps, recording machine state
        shell: powershell
        timeout-minutes: 12
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage removal -Out oracle-out
      - name: Removal recording must match the committed one
        shell: bash
        run: |
          golden=oracle/golden/v3.6.0/removal.jsonl
          if [ ! -f oracle-out/removal.jsonl ]; then
            echo "::error title=oracle removal (${{ matrix.os }})::no recording was produced"; exit 1
          fi
          if ! git ls-files --error-unmatch "$golden" >/dev/null 2>&1; then
            echo "::notice title=oracle removal (${{ matrix.os }})::no committed recording yet; this run only records"; exit 0
          fi
          cp oracle-out/removal.jsonl "$golden"
          if git diff --exit-code --quiet -- "$golden"; then
            echo "::notice title=oracle removal (${{ matrix.os }})::$(wc -l < "$golden" | tr -d ' ') recorded lines reproduced byte-for-byte; sha256 $(sha256sum "$golden" | cut -c1-64)"
          else
            git diff -U0 --word-diff=porcelain --word-diff-regex='[^,{}]+' -- "$golden" | grep -E '^[+-][^+-]' | head -8 | while IFS= read -r line; do
              echo "::warning title=oracle removal diff (${{ matrix.os }})::${line:0:500}"
            done
            echo "::error title=oracle removal (${{ matrix.os }})::recording differs from the committed one"; exit 1
          fi
      - name: How 3.6 reads this machine's uninstall registrations
        shell: powershell
        timeout-minutes: 8
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage inventory -Out oracle-out
      - name: Real WinGet install through the 3.6 install path
        shell: powershell
        timeout-minutes: 25
        continue-on-error: true
        run: .\oracle\observe-machine.ps1 -DisposableEnvironment -Stage winget -Out oracle-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-observations-${{ matrix.os }}
          path: oracle-out/
          if-no-files-found: warn
