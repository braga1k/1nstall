[workspace]
resolver = "3"
members = ["core", "platform", "harness", "cli", "ffi"]

[workspace.package]
version = "4.0.0-alpha.0"
edition = "2021"
rust-version = "1.86"
publish = false

[workspace.dependencies]
regex = "1.11"
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
