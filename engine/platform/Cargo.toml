[package]
name = "oneinstall-platform"
description = "Windows implementation of the Host trait and of the engine's machine operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oneinstall-core = { path = "../core" }
serde_json = { workspace = true, features = ["preserve_order"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
