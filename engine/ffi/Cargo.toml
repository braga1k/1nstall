[package]
name = "oneinstall-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "oneinstall_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
oneinstall-core = { path = "../core" }
oneinstall-platform = { path = "../platform" }
# Order matters: translation patterns are tried in the order of locales.json, as 3.6 tries them.
serde_json = { workspace = true, features = ["preserve_order"] }
